  function cardHTML(book) {
    var photo = normalizePhoto(book.photo);
    var out = '<article class="card" data-action="edit" data-id="' + book.id + '" role="button" tabindex="0">';
    out += '<div class="card-inner">';

    if (photo) {
      out += '<div class="card-photo" data-action="photo" data-id="' + book.id + '" role="button" tabindex="0"' +
        ' aria-label="' + esc(book.title || '책') + ' 사진 크게 보기">' +
        '<img src="' + esc(photo) + '" alt="" loading="lazy" decoding="async"></div>';
    }

    out += '<div class="card-main">';
    out += '<div class="card-head"><h3 class="card-title">' + esc(book.title || '(제목 없음)') + '</h3>';
    out += '<span class="badge ' + (STATUS_CLASS[book.status] || '') + '">' + esc(book.status) + '</span></div>';

    var meta = [];
    if (book.author) meta.push('<span>' + esc(book.author) + '</span>');
    var startedAt = parseDate(book.started_at, false);
    if (startedAt && book.date) {
      meta.push('<span>시작 ' + esc(formatDate(startedAt)) + '</span>');
      meta.push('<span>완료 ' + esc(formatDate(book.date)) + '</span>');
    } else if (startedAt) {
      meta.push('<span>시작 ' + esc(formatDate(startedAt)) + '</span>');
    } else if (book.date) {
      meta.push('<span>' + esc(formatDate(book.date)) + '</span>');
    }
    if (meta.length) out += '<p class="card-meta">' + meta.join('<span class="dot">·</span>') + '</p>';

    out += '<div class="card-stars">' +
      (book.rating > 0 ? starsHTML(book.rating) : '<span class="no-rating">별점 없음</span>') + '</div>';

    /* 사진첩에 담은 사진이 있으면 작은 표시를 남깁니다. 누르면 바로 사진첩이 열립니다. */
    var albumCount = bookGallery(book).length;
    if (albumCount) {
      out += '<div class="card-album"><button type="button" class="album-badge" data-action="album"' +
        ' data-id="' + book.id + '" aria-label="' + esc(book.title || '책') + ' 사진첩 ' +
        albumCount + '장 크게 보기">📸 사진첩 ' + albumCount + '</button></div>';
    }

    if (book.memo) out += '<p class="card-memo">' + esc(book.memo) + '</p>';

    if (book.tags && book.tags.length) {
      out += '<div class="tag-row">';
      for (var i = 0; i < book.tags.length; i++) {
        out += '<span class="tag">#' + esc(book.tags[i]) + '</span>';
      }
      out += '</div>';
    }

    out += '</div></div>';
    return out + '</article>';
  }

      '<button type="button" class="btn primary" data-action="open-new">첫 책 추가하기</button>' +

  function renderHeader() {
    var done = 0;
    for (var i = 0; i < state.books.length; i++) {
      if (state.books[i].status === '완독') done += 1;
    }
    var title = state.view === 'stats' ? '독서 통계' : (state.view === 'backup' ? '백업·관리' : '내 책장');
    els.headTitle.textContent = title;

    if (!state.books.length) {
      els.headSub.textContent = '첫 책을 기록해 보세요';
    } else {
      var thisYear = new Date().getFullYear();
      var yearCount = 0;
      for (var j = 0; j < state.books.length; j++) {
        if (state.books[j].status === '완독' && bookYear(state.books[j]) === thisYear) yearCount += 1;
      }
      els.headSub.textContent = '총 ' + state.books.length + '권 · 완독 ' + done + '권 · 올해 ' + yearCount + '권';
    }

    if (shared.active) {
      els.headSub.textContent = '🔗 공유 중 · ' + els.headSub.textContent;
    }
  }

  function renderShelf() {
    var searched = searchBooks(state.books, state.q);
    var q = state.q.trim();

    var counts = { '전체': searched.length };
    STATUSES.forEach(function (s) { counts[s] = 0; });
    for (var i = 0; i < searched.length; i++) {
      if (counts[searched[i].status] != null) counts[searched[i].status] += 1;
    }

    var pillHTML = '';
    for (var p = 0; p < FILTERS.length; p++) {
      var f = FILTERS[p];
      pillHTML += '<button type="button" class="pill' + (state.status === f ? ' on' : '') +
        '" data-action="filter" data-status="' + esc(f) + '">' + esc(f) +
        ' <span class="pill-n">' + counts[f] + '</span></button>';
    }
    els.pills.innerHTML = pillHTML;

    var list = (state.status === '전체') ? searched.slice() : searched.filter(function (b) {
      return b.status === state.status;
    });
    sortBooks(list, state.sort);

    els.searchClear.className = 'search-clear' + (q ? ' on' : '');

    if (!state.books.length) {
      els.resultCount.textContent = '';
      els.toolbar.className = 'toolbar off';
      els.list.innerHTML = emptyShelfHTML();
      return;
    }

    els.toolbar.className = 'toolbar';

    els.resultCount.textContent = q ? '검색 결과 ' + list.length + '권' : '총 ' + list.length + '권';

    if (!list.length) {
      els.list.innerHTML = emptyFilterHTML();
      return;
    }

    var html = '';
    for (var k = 0; k < list.length; k++) html += cardHTML(list[k]);
    els.list.innerHTML = html;
  }

  function renderStats() {
    var s = computeStats(state.books);
    var html = '';

    if (!state.books.length) {
      html = '<div class="empty"><div class="emo">📊</div><h3>아직 통계가 없어요</h3>' +
        '<p>책을 한 권이라도 기록하면<br>여기에 통계가 쌓입니다.</p>' +
        '<button type="button" class="btn primary" data-action="open-new">첫 책 추가하기</button></div>';
      els.viewStats.innerHTML = html;
      return;
    }

    html += '<div class="stat-grid">' +
      statCard('총 권수', s.total, '권') +
      statCard('완독', s.byStatus['완독'], '권') +
      statCard(s.year + '년 완독', s.finishedThisYear, '권') +
      statCard('평균 별점', s.average ? s.average.toFixed(1) : '–', s.average ? '점' : '') +
      '</div>';

    /* 상태 분포 */
    html += '<div class="panel"><h3>📚 상태 분포</h3>';
    for (var i = 0; i < STATUSES.length; i++) {
      var st = STATUSES[i];
      var count = s.byStatus[st];
      var pct = s.total ? Math.round((count / s.total) * 100) : 0;
      html += '<div class="bar-row">' +
        '<span class="bar-label one-line">' + esc(st) + '</span>' +
        '<div class="bar-track"><div class="bar-fill ' + BAR_CLASS[st] + '" style="width:' +
        (count ? Math.max(pct, 4) : 0) + '%"></div></div>' +
        '<span class="bar-val">' + count + '권</span></div>';
    }
    html += '<p class="panel-note">평균 별점은 별점을 남긴 ' + s.ratedCount + '권으로 계산했습니다.</p></div>';

    /* 태그 */
    html += '<div class="panel"><h3>🏷 자주 쓴 태그</h3>';
    if (!s.topTags.length) {
      html += '<p class="panel-note">아직 태그가 없습니다. 책을 추가할 때 태그를 적어 보세요.</p>';
    } else {
      var top = s.topTags.slice(0, 8);
      var maxTag = top[0][1];
      for (var t = 0; t < top.length; t++) {
        var w = Math.round((top[t][1] / maxTag) * 100);
        html += '<div class="bar-row">' +
          '<span class="bar-label ell">#' + esc(top[t][0]) + '</span>' +
          '<div class="bar-track"><div class="bar-fill b-tag" style="width:' + Math.max(w, 6) + '%"></div></div>' +
          '<span class="bar-val">' + top[t][1] + '권</span></div>';
      }
    }
    html += '</div>';

    /* 연도별 */
    var years = Object.keys(s.byYear).map(Number).sort(function (a, b) { return b - a; }).slice(0, 6);
    html += '<div class="panel"><h3>📅 연도별 기록</h3>';
    if (!years.length) {
      html += '<p class="panel-note">날짜가 있는 책이 없어서 연도별 기록이 비어 있습니다.</p>';
    } else {
      var maxYear = 1;
      years.forEach(function (y) { maxYear = Math.max(maxYear, s.byYear[y].total); });
      for (var y2 = 0; y2 < years.length; y2++) {
        var year = years[y2];
        var info = s.byYear[year];
        html += '<div class="bar-row">' +
          '<span class="bar-label">' + year + '년<span class="sub">완독 ' + info.done + '권</span></span>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' +
          Math.max(Math.round((info.total / maxYear) * 100), 6) + '%"></div></div>' +
          '<span class="bar-val">' + info.total + '권</span></div>';
      }
    }
    html += '</div>';

    /* 월별 */
    var maxMonth = 1;
    for (var m = 0; m < 12; m++) maxMonth = Math.max(maxMonth, s.monthly[m]);
    html += '<div class="panel"><h3>🗓 ' + s.year + '년 월별 완독</h3><div class="monthly">';
    for (var mo = 0; mo < 12; mo++) {
      var mc = s.monthly[mo];
      var h = mc ? Math.max(Math.round((mc / maxMonth) * 74), 6) : 3;
      html += '<div class="month" title="' + (mo + 1) + '월 ' + mc + '권">' +
        '<div class="mbar-wrap"><div class="mbar' + (mc ? '' : ' zero') + '" style="height:' + h + 'px"></div></div>' +
        '<span class="mlabel">' + (mo + 1) + '</span></div>';
    }
    html += '</div><p class="panel-note">' + s.year + '년에 완독한 책을 날짜 기준으로 센 그래프입니다.</p></div>';

    els.viewStats.innerHTML = html;
  }

    html += '<div class="kv-row"><span class="k">저장 방식</span><span class="v ok">' +

      '📸 사진첩 사진은 글씨가 읽히도록 긴 변 1000px로 저장합니다(한 장 80~180KB).</p>';
    if (store.mode === 'idb') {
      html += '<p class="hint">예전 저장소(약 5MB)에서 IndexedDB 로 옮겨 사진을 수백 MB까지 담을 수 있습니다. ' +
        '옮긴 기록은 다시 읽어 확인한 뒤에만 옛 사본을 지웁니다.' +

    html += '<div class="panel"><h3>📤 내보내기</h3><div class="btn-stack">';
    html += '<button type="button" class="btn block" data-action="export-json">JSON으로 내보내기 (books.json)</button>';
    html += '<button type="button" class="btn block" data-action="export-csv">CSV로 내보내기 (엑셀용)</button>';
    html += '</div><p class="hint">JSON은 컴퓨터의 book_tracker.py 와 그대로 주고받을 수 있는 형식입니다. ' +
      'CSV는 UTF-8(BOM)이라 엑셀에서 한글이 깨지지 않습니다.</p></div>';

    html += '<div class="panel"><h3>📥 가져오기</h3>';
    html += '<label class="btn block" for="import-input">JSON 파일 가져오기</label>';
    html += '<input id="import-input" class="file-input" type="file" accept=".json,application/json">';
    html += '<p class="hint">book_tracker.py 의 books.json 을 그대로 가져올 수 있어요. ' +
      '가져올 때 <strong>병합</strong>(없는 책만 추가) 또는 <strong>덮어쓰기</strong>(지금 기록을 모두 교체)를 고를 수 있습니다.</p></div>';

    html += '<div class="panel"><h3>🔑 AI 표지 인식 (Gemini API)</h3>' +
      '<p class="hint">사진을 넣으면 표지에서 책 제목과 저자를 읽어 자동으로 채워 줍니다. ' +
      '이때만 긴 변 1200px 사본을 따로 만들어 Google Gemini 로 보내고, 저장소에는 남기지 않습니다. ' +
      'Gemini 는 Google 검색으로 실제 책의 공식 제목·저자를 확인합니다. ' +
      '키는 이 브라우저(localStorage)에만 저장되고 <strong>books.json · CSV 로 내보내지 않습니다</strong>. ' +
      '인터넷이 필요하고, 하루 무료 사용량이 정해져 있어요. 키가 없어도 사진·촬영일 기능은 그대로 씁니다.</p>' +
      '<div class="key-row">' +
      '<input id="gemini-key" class="input" type="password" autocomplete="off" spellcheck="false" ' +
      'placeholder="Gemini API 키 (AIza...)" aria-label="Gemini API 키">' +
      '<button type="button" class="btn sm" data-action="gemini-toggle" id="gemini-toggle" aria-label="키 보이기">👁</button>' +

      '<button type="button" class="btn sm primary" data-action="gemini-save">키 저장</button>' +

      '</div>' +
      '<p class="key-state" id="gemini-state"></p>' +

      'rel="noopener">Google AI Studio · aistudio.google.com/apikey</a> 에서 ‘Create API key’ 를 누르면 됩니다. ' +
      '키를 넣지 않아도 사진·날짜·백업은 모두 그대로 동작합니다.</p></div>';

    html += sharePanelHTML();

    html += '<div class="danger-panel"><h3>⚠️ 위험 구역</h3>' +
      '<p>모든 기록을 지웁니다. 되돌릴 수 없으니 먼저 백업하는 것을 권합니다.</p>' +
      '<button type="button" class="btn danger block" data-action="clear-all">모든 기록 삭제</button></div>';

    els.viewBackup.innerHTML = html;
    syncGeminiPanel();
  }

  /* ---------- Gemini API 키 (이 브라우저에만) ---------- */

  function geminiInputEl() {
    return document.getElementById('gemini-key');
  }

  function syncGeminiPanel() {
    var input = geminiInputEl();
    var stateEl = document.getElementById('gemini-state');
    var toggle = document.getElementById('gemini-toggle');
    var key = getGeminiKey();
    if (input) {
      input.value = key;
      input.type = state.keyVisible ? 'text' : 'password';
    }
    if (toggle) {
      toggle.textContent = state.keyVisible ? '🙈' : '👁';
      toggle.setAttribute('aria-label', state.keyVisible ? '키 가리기' : '키 보이기');
    }
    if (stateEl) {
      if (key) {
        stateEl.className = 'key-state on';
        stateEl.textContent = '키 저장됨 · 끝 4자리 ' + key.slice(-4) + ' · 표지 인식 켜짐';
      } else {
        stateEl.className = 'key-state';
        stateEl.textContent = '아직 키가 없어요. 키를 넣으면 사진에서 제목·저자를 자동으로 읽어요.';
      }
    }
  }

  function saveGeminiKeyFromInput() {
    var input = geminiInputEl();
    var value = input ? String(input.value || '').trim() : '';
    if (!value) {
      toast('Gemini API 키를 입력해 주세요.');
      return;
    }
    if (!setGeminiKey(value)) {
      toast('키를 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.');
      return;
    }
    syncGeminiPanel();
    renderAiHint();
    toast('Gemini API 키를 이 브라우저에만 저장했어요.');
  }

  function clearGeminiKeyFromUI() {
    clearGeminiKey();
    state.keyVisible = false;
    syncGeminiPanel();
    renderAiHint();
    toast('Gemini API 키를 지웠어요.');
  }

  function toggleGeminiVisibility() {
    state.keyVisible = !state.keyVisible;
    var input = geminiInputEl();
    var toggle = document.getElementById('gemini-toggle');
    if (input) input.type = state.keyVisible ? 'text' : 'password';
    if (toggle) {
      toggle.textContent = state.keyVisible ? '🙈' : '👁';
      toggle.setAttribute('aria-label', state.keyVisible ? '키 가리기' : '키 보이기');
    }
  }

  /* ------------------------------------------------------------------
     화면 전환
     ------------------------------------------------------------------ */

  var TAB_BUTTONS = [];

  function setView(view) {
    state.view = view;
    els.viewShelf.className = view === 'shelf' ? '' : 'hidden';
    els.viewStats.className = view === 'stats' ? '' : 'hidden';
    els.viewBackup.className = view === 'backup' ? '' : 'hidden';

    for (var i = 0; i < TAB_BUTTONS.length; i++) {
      var on = TAB_BUTTONS[i].getAttribute('data-view') === view;
      TAB_BUTTONS[i].className = on ? 'tab on' : 'tab';
      TAB_BUTTONS[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }

    if (view === 'stats') renderStats();
    if (view === 'backup') renderBackup();
    els.fab.className = view === 'shelf' ? 'fab' : 'fab hidden';
    renderHeader();

    try { window.scrollTo(0, 0); } catch (err) {}
  }

  function renderAll() {
    renderHeader();
    renderShelf();
    if (state.view === 'stats') renderStats();
    if (state.view === 'backup') renderBackup();
  }

  /* ------------------------------------------------------------------
     토스트 / 다이얼로그
     ------------------------------------------------------------------ */

  var toastTimer = null;
  var toastQueue = [];

  function toastNow(message) {
    els.toast.textContent = message;
    els.toast.className = 'toast show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastTimer = null;
      els.toast.className = 'toast';
      if (toastQueue.length) {
        var next = toastQueue.shift();
        setTimeout(function () { toastNow(next); }, 220);
      }
    }, 2200);
  }

  /* 앞의 안내가 사라진 뒤에 이어서 보여 줍니다. (사진 촬영일 → 표지 인식) */
  function toast(message) {
    if (toastTimer) {
      if (toastQueue.length < 2) toastQueue.push(message);
      return;
    }
    toastNow(message);
  }

  function closeDialog() {
    els.dialog.className = 'dialog hidden';
    els.dialogBackdrop.className = 'backdrop hidden';
    els.dlgActions.innerHTML = '';
  }

  function askDialog(options) {
    var opts = options || {};
    els.dlgTitle.textContent = opts.title || '';
    els.dlgMsg.textContent = opts.message || '';
    els.dlgActions.innerHTML = '';

    var actions = (opts.actions || []).slice();
    actions.push({ label: opts.cancelLabel || '취소', style: 'ghost' });

    actions.forEach(function (action) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn' + (action.style ? ' ' + action.style : '');
      btn.textContent = action.label;
      btn.addEventListener('click', function () {
        closeDialog();
        if (typeof action.onClick === 'function') action.onClick();
      });
      els.dlgActions.appendChild(btn);
    });

    els.dialogBackdrop.className = 'backdrop';
    els.dialog.className = 'dialog';
  }

  /* ------------------------------------------------------------------
     입력 시트
     ------------------------------------------------------------------ */

  function renderSeg() {
    var html = '';
    for (var i = 0; i < STATUSES.length; i++) {
      var s = STATUSES[i];
      html += '<button type="button" data-action="status" data-status="' + esc(s) + '"' +
        ' class="' + (state.draftStatus === s ? 'on' : '') + '"' +
        ' aria-pressed="' + (state.draftStatus === s ? 'true' : 'false') + '">' + esc(s) + '</button>';
    }
    els.seg.innerHTML = html;
  }

  function renderStars() {
    var html = '';
    for (var i = 1; i <= 5; i++) {
      html += '<button type="button" data-action="star" data-v="' + i + '"' +
        ' class="' + (i <= state.draftRating ? 'on' : '') + '"' +
        ' aria-label="' + i + '점">★</button>';
    }
    els.starRow.innerHTML = html;
    els.starLabel.textContent = state.draftRating ? state.draftRating + '점' : '별점 없음';
  }

  function renderPhoto() {
    if (!els.photoThumb) return;
    var url = normalizePhoto(state.draftPhoto);

    if (state.photoBusy) {
      els.photoThumb.className = 'photo-thumb';
      els.photoThumb.innerHTML = '<span class="photo-busy">줄이는 중…</span>';
    } else if (url) {
      els.photoThumb.className = 'photo-thumb has';
      els.photoThumb.innerHTML = '<img src="' + esc(url) + '" alt="선택한 사진 미리보기">';
    } else {
      els.photoThumb.className = 'photo-thumb';
      els.photoThumb.innerHTML = '📷';
    }

    els.btnPhotoClear.className = 'btn sm danger' + ((url && !state.photoBusy) ? '' : ' hidden');
    els.photoPick.className = 'btn sm' + (state.photoBusy ? ' hidden' : '');

    if (state.photoBusy) {
      els.photoMeta.textContent = '사진을 줄이는 중이에요…';
    } else if (url) {
      els.photoMeta.textContent = '사진 ' + formatKB(photoSizeKB(url)) +
        ' · 긴 변 600px JPEG로 줄여서 저장합니다. 카드에서 누르면 크게 볼 수 있어요.';
    } else {
      els.photoMeta.textContent = '휴대폰에서 고르거나 바로 찍을 수 있어요. 긴 변 600px JPEG로 자동으로 줄여 저장합니다.';
    }

    renderExif();
    renderCover();
    renderAiHint();
  }

  /* 사진에서 읽은 촬영일과 독서 시작일 칸을 맞춰 보여 줍니다. */
  function renderExif() {
    if (!els.exifStatus) return;
    var iso = state.draftExifDate;
    if (!iso) {
      els.exifStatus.className = 'photo-ai hidden';
      els.exifStatus.innerHTML = '';
      return;
    }
    els.exifStatus.className = 'photo-ai';
    if (parseDate(els.fStart.value, false) === iso) {
      els.exifStatus.innerHTML = '<span>🕒 사진 촬영일 ' + esc(iso) + ' · 독서 시작일에 넣었어요</span>';
    } else {
      els.exifStatus.innerHTML = '<span>🕒 사진 촬영일 ' + esc(iso) + '</span>' +
        '<button type="button" class="suggest-apply" data-action="use-exif-start">시작일에 넣기</button>';
    }
  }

  /* 표지 인식 상태 / 제안 줄 */
  function renderCover() {
    if (!els.coverStatus || !els.coverText || !els.coverApply) return;
    var cls = 'photo-ai';
    var text = '';
    var showApply = false;

    if (state.coverBusy) {
      cls += ' busy';
      text = '🔍 책 표지에서 제목을 읽고 있어요…';
    } else if (state.coverError) {
      cls += ' warn';
      text = '⚠ ' + state.coverError;
    } else if (state.coverTitle || state.coverAuthor || state.coverCategory) {
      var bits = [];
      if (state.coverTitle) bits.push('"' + state.coverTitle + '"');
      if (state.coverAuthor) bits.push(state.coverAuthor);
      if (state.coverCategory) bits.push('장르 ' + state.coverCategory);
      text = '🏷 표지에서 읽음: ' + bits.join(' · ');
      showApply = (!!state.coverTitle && els.fTitle.value.trim() !== state.coverTitle) ||
        (!!state.coverAuthor && els.fAuthor.value.trim() !== state.coverAuthor) ||
        (!!state.coverCategory && canAutoTag() &&
          parseTags(els.fTags.value).indexOf(state.coverCategory) === -1);
    }

    if (!text) {
      els.coverStatus.className = 'photo-ai hidden';
      els.coverText.textContent = '';
      els.coverApply.className = 'suggest-apply hidden';
      return;
    }
    els.coverStatus.className = cls;
    els.coverText.textContent = text;
    els.coverApply.className = 'suggest-apply' + (showApply ? '' : ' hidden');
  }

  /* 키가 없을 때만 조용히 알려 줍니다. */
  function renderAiHint() {
    if (!els.photoAiHint) return;
    els.photoAiHint.className = 'photo-hint' + (getGeminiKey() ? ' hidden' : '');
  }

  /* 촬영일(또는 사진을 넣은 날)을 독서 시작일 칸에 넣습니다.
     직접 고쳤거나 이미 들어 있는 날짜는 건드리지 않습니다. */
  function applyPhotoStartDate(iso) {
    if (!iso) return '';
    var current = parseDate(els.fStart.value, false);
    if (current === iso) return 'same';
    if (state.startTouched) return 'kept';
    if (current) return 'kept';
    els.fStart.value = iso;
    return 'filled';
  }

  function startCoverRecognition(dataUrl) {
    if (!getGeminiKey() || !dataUrl) { renderCover(); return; }
    state.coverToken = (state.coverToken || 0) + 1;
    var token = state.coverToken;
    state.coverBusy = true;
    state.coverError = '';
    state.coverTitle = '';
    state.coverAuthor = '';
    state.coverCategory = '';
    renderCover();

    recognizeCover(dataUrl).then(function (result) {
      if (token !== state.coverToken) return;
      state.coverBusy = false;
      if (!result || (!result.title && !result.author)) {
        state.coverError = '표지에서 제목을 읽지 못했어요 (원인: 빈 응답). 직접 넣어 주세요.';
        renderCover();
        return;
      }
      state.coverTitle = result.title || '';
      state.coverAuthor = result.author || '';
      state.coverCategory = normalizeGenre(result.category || '');
      var filledTitle = false;
      var filledAuthor = false;
      if (state.coverTitle && !els.fTitle.value.trim()) {
        els.fTitle.value = state.coverTitle;
        filledTitle = true;
      }
      if (state.coverAuthor && !els.fAuthor.value.trim()) {
        els.fAuthor.value = state.coverAuthor;
        filledAuthor = true;
      }
      /* 표지가 알려 준 장르를 태그에 넣습니다. (못 읽었으면 제목으로 짐작) */
      var genre = state.coverCategory || inferGenreTag(state.coverTitle, state.coverAuthor);
      var tagged = addTagIfAllowed(genre);
      renderCover();
      if (filledTitle) toast('표지에서 제목을 읽어 채웠어요');
      else if (filledAuthor) toast('표지에서 저자를 읽어 채웠어요');
      else if (tagged) toast('표지에서 장르 ‘' + tagged + '’을(를) 태그에 넣었어요');
    }, function (err) {
      if (token !== state.coverToken) return;
      state.coverBusy = false;
      state.coverError = (err && err.message) || '표지를 읽지 못했어요. 제목을 직접 넣어 주세요.';
      renderCover();
    });
  }

  /* 카카오톡·네이버·인스타그램처럼 앱 안에서 여는 브라우저(WebView)인지.
     그런 브라우저는 큰 사진을 열지 못하거나 파일 선택이 막히기도 합니다. */
  function isInAppBrowser() {
    var ua = String((typeof navigator !== 'undefined' && navigator && navigator.userAgent) || '');
    if (/KAKAOTALK|NAVER\(|DaumApps|Instagram|FBAN|FBAV|Line\/|Twitter|Snapchat|Threads/i.test(ua)) return true;
    return /Android/i.test(ua) && /;\s*wv\)/.test(ua);
  }

  function inAppBrowserHint() {
    if (!isInAppBrowser()) return '';
    return ' 앱 안의 브라우저라면 크롬이나 삼성 인터넷으로 열어 다시 해 보세요.';
  }

  function handlePhotoFile(file) {
    if (!file) return;

    if (!isImageFile(file)) {
      toast('사진 파일만 넣을 수 있어요.');
      return;
    }
    if (file.size && file.size > PHOTO_MAX_FILE) {
      toast('사진이 너무 커요. 25MB 이하 사진을 골라 주세요.');
      return;
    }
    if (state.photoBusy) return;

    state.photoBusy = true;
    state.draftExifDate = '';
    state.coverBusy = false;
    state.coverError = '';
    state.coverTitle = '';
    state.coverAuthor = '';
    state.coverCategory = '';
    state.coverToken = (state.coverToken || 0) + 1;
    renderPhoto();

    /* 줄이기 전에 원본 바이트에서 촬영일(EXIF)을 먼저 꺼냅니다. */
    readPhotoBytes(file).then(function (buffer) {
      var exifDate = extractExifDate(buffer);
      /* 키가 있을 때만 AI 용 1200px 사본을 함께 만듭니다(저장하지 않음). */
      return compressPhotoForStore(file, !!getGeminiKey()).then(function (images) {
        return { url: images.stored, aiUrl: images.ai, exifDate: exifDate };
      });
    }).then(function (out) {
      state.photoBusy = false;
      state.draftPhoto = out.url;
      state.draftExifDate = out.exifDate || '';
      var sizeText = formatKB(photoSizeKB(out.url));
      /* 촬영일이 있으면 그 날, 없으면 사진을 넣은 오늘을 독서 시작일로 넣습니다.
         독서 완료일은 사진 때문에 바뀌지 않습니다. */
      var startISO = out.exifDate || todayISO();
      var startResult = applyPhotoStartDate(startISO);
      renderPhoto();

      if (out.exifDate && startResult === 'filled') {
        toast('사진 촬영일(' + out.exifDate + ')을 독서 시작일에 넣었어요');
      } else if (out.exifDate) {
        toast('사진 촬영일은 ' + out.exifDate + '예요. 독서 시작일은 그대로 두었어요.');
      } else if (startResult === 'filled') {
        toast('사진 등록일(' + startISO + ')을 독서 시작일에 넣었어요');
      } else {
        toast('사진을 ' + sizeText + '로 줄여 넣었어요.');
      }

      startCoverRecognition(out.aiUrl || out.url);
    }).catch(function (err) {
      state.photoBusy = false;
      renderPhoto();
      var reason = String((err && err.message) || '');
      /* 왜 안 됐는지에 따라 안내를 달리합니다. */
      if (isHeicFile(file)) {
        toast('아이폰 HEIC 사진은 브라우저에서 열지 못할 수 있어요. JPG로 바꾼 사진을 골라 주세요.');
      } else if (reason === 'too-big') {
        toast('사진을 충분히 줄이지 못했어요. 다른 사진으로 다시 해 보세요.');
      } else if (reason === 'decode-failed' || reason === 'read-failed' || reason === 'empty-image') {
        toast('사진을 열지 못했어요.' + inAppBrowserHint());
      } else {
        toast('사진을 읽지 못했어요. 다른 사진으로 다시 해 보세요.');
      }
    });
  }

  /* ------------------------------------------------------------------
     📸 사진첩 화면 (입력 시트 안의 그리드) + 사진 크게 보기(라이트박스)
     ------------------------------------------------------------------ */

  function albumItemHTML(item, index) {
    var note = item.note || '';
    var label = note || ('사진 ' + (index + 1));
    var out = '<div class="album-item" data-gallery-id="' + esc(item.id) + '">';
    out += '<button type="button" class="album-shot" data-action="album-photo" data-index="' + index + '"' +
      ' aria-label="' + esc(label) + ' 크게 보기">' +
      '<img src="' + esc(item.dataUrl) + '" alt="" loading="lazy" decoding="async"></button>';
    out += '<button type="button" class="album-del" data-action="album-del" data-index="' + index + '"' +
      ' aria-label="' + esc(label) + ' 삭제">✕</button>';
    out += '<input class="album-note" type="text" maxlength="' + GALLERY_NOTE_MAX + '"' +
      ' data-gallery-note="' + esc(item.id) + '" value="' + esc(note) + '"' +
      ' placeholder="메모 (예: p.142 기억하고 싶은 문장)"' +
      ' aria-label="' + esc((index + 1) + '번째 사진 메모') + '">';
    return out + '</div>';
  }

  function renderAlbum() {
    if (!els.albumGrid || !els.albumMeta || !els.albumEmpty) return;
    var items = state.draftGallery || [];

    if (els.galleryPick) els.galleryPick.className = 'btn sm' + (state.galleryBusy ? ' hidden' : '');

    var html = '';
    for (var i = 0; i < items.length; i++) html += albumItemHTML(items[i], i);
    els.albumGrid.innerHTML = html;
    els.albumEmpty.className = 'album-empty' + (items.length ? ' hidden' : '');

    var text = '';
    if (state.galleryBusy) {
      text = '사진을 줄이는 중이에요… (' + state.galleryDone + '/' + state.galleryTotal + ')';
    } else if (!items.length) {
      text = '기억하고 싶은 구절을 찍어 두면 이 책의 사진첩에 모입니다. (긴 변 1000px JPEG — 글씨가 읽리는 크기)';
    } else {
      text = '사진 ' + items.length + '장 · 약 ' + formatKB(galleryTotalKB(items)) +
        ' · 사진을 누르면 크게 보고, 아래 칸에 페이지·메모를 남길 수 있어요. 저장을 누르면 반영됩니다.';
    }
    var warn = galleryTotalChars(items) > galleryWarnChars();
    if (warn && !state.galleryBusy) {
      text += ' 저장 공간이 빠듯해요 — 몇 장만 남기거나 ‘백업·관리’에서 JSON으로 내보낸 뒤 정리해 주세요.';
    }
    els.albumMeta.className = 'photo-meta album-meta' + (warn ? ' warn' : '');
    els.albumMeta.textContent = text;
  }

  function setDraftGalleryNote(id, value) {
    var items = state.draftGallery || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].id !== id) continue;
      var next = { id: items[i].id, dataUrl: items[i].dataUrl };
      var note = normalizeGalleryNote(value);
      if (note) next.note = note;
      if (items[i].addedAt) next.addedAt = items[i].addedAt;
      items[i] = next;
      return;
    }
  }

  function removeDraftGalleryItem(index) {
    var items = (state.draftGallery || []).slice();
    if (index < 0 || index >= items.length) return false;
    items.splice(index, 1);
    state.draftGallery = items;
    return true;
  }

  /* 고른 사진 여러 장을 한 장씩 줄여 사진첩 초안에 담습니다. */
  function handleGalleryFiles(fileList) {
    var files = [];
    var i;
    for (i = 0; fileList && i < fileList.length; i++) files.push(fileList[i]);
    if (!files.length) return;
    if (state.galleryBusy) {
      toast('사진을 담는 중이에요. 잠깐만 기다려 주세요.');
      return;
    }

    var room = GALLERY_MAX_COUNT - (state.draftGallery || []).length;
    if (room <= 0) {
      toast('사진첩은 책마다 ' + GALLERY_MAX_COUNT + '장까지 담을 수 있어요.');
      return;
    }

    var accepted = [];
    var skipped = 0;
    var rejected = 0;
    var heic = false;
    for (i = 0; i < files.length; i++) {
      var file = files[i];
      if (!isImageFile(file)) { rejected += 1; continue; }
      if (isHeicFile(file)) heic = true;
      if (file.size && file.size > PHOTO_MAX_FILE) { rejected += 1; continue; }
      if (accepted.length >= room) { skipped += 1; continue; }
      accepted.push(file);
    }
    if (!accepted.length) {
      if (rejected) toast('사진 파일만 넣을 수 있어요. (25MB 이하 JPG·PNG)' + (heic ? ' 아이폰 HEIC 사진은 JPG로 바꿔 주세요.' : ''));
      else toast('사진첩은 책마다 ' + GALLERY_MAX_COUNT + '장까지 담을 수 있어요.');
      return;
    }

    state.galleryBusy = true;
    state.galleryDone = 0;
    state.galleryTotal = accepted.length;
    renderAlbum();

    var added = 0;
    var failedHeic = 0;
    var failedBig = 0;
    var failedDecode = 0;
    var chain = Promise.resolve();
    accepted.forEach(function (one) {
      chain = chain.then(function () {
        return compressGalleryImage(one).then(function (url) {
          state.draftGallery = (state.draftGallery || []).concat([{
            id: galleryId(), dataUrl: url, note: '', addedAt: new Date().toISOString()
          }]);
          added += 1;
        }, function (err) {
          var reason = String((err && err.message) || '');
          if (isHeicFile(one)) failedHeic += 1;
          else if (reason === 'too-big') failedBig += 1;
          else failedDecode += 1;
        });
      }).then(function () {
        state.galleryDone += 1;
        renderAlbum();
      });
    });

    chain.then(function () {
      state.galleryBusy = false;
      state.galleryDone = 0;
      state.galleryTotal = 0;
      renderAlbum();

      var bits = [];
      if (added) bits.push('사진 ' + added + '장을 사진첩에 담았어요. (저장을 누르면 반영)');
      if (failedHeic) bits.push(failedHeic + '장은 아이폰 HEIC 사진이라 열지 못했어요 — JPG로 바꿔 주세요.');
      if (failedBig) bits.push(failedBig + '장은 글자가 너무 빽빽해 줄이지 못했어요 — 조금 멀리서 다시 찍어 주세요.');
      if (failedDecode) bits.push(failedDecode + '장은 사진을 열지 못했어요.' + inAppBrowserHint());
      if (skipped) bits.push(skipped + '장은 ' + GALLERY_MAX_COUNT + '장 한도로 건너뛰었어요');
      if (!bits.length) bits.push('사진을 담지 못했어요. 다른 사진으로 다시 해 보세요.');
      toast(bits.join(' '));
    });
  }

  var lightbox = { items: [], index: 0, title: '', subtitle: '', kind: 'cover' };

  function renderLightbox() {
    var items = lightbox.items || [];
    var item = items[lightbox.index] || {};
    els.photoViewImg.src = item.dataUrl || '';
    els.photoViewImg.alt = (lightbox.title || '사진') + ' 사진';
    var cap = [];
    if (lightbox.title) cap.push(lightbox.title);
    if (lightbox.subtitle) cap.push(lightbox.subtitle);
    els.photoViewCap.textContent = cap.join(' · ');
    els.photoViewNote.textContent = item.note || '';
    var many = items.length > 1;
    els.photoViewPrev.className = 'pv-nav pv-prev' + (many ? '' : ' hidden');
    els.photoViewNext.className = 'pv-nav pv-next' + (many ? '' : ' hidden');
    els.photoViewCount.textContent = many ? (lightbox.index + 1) + ' / ' + items.length : '';
  }

  function showLightbox(items, index, meta) {
    var list = (items || []).slice();
    if (!list.length) return;
    lightbox.items = list;
    lightbox.index = Math.max(0, Math.min(list.length - 1, index || 0));
    lightbox.title = (meta && meta.title) || '';
    lightbox.subtitle = (meta && meta.subtitle) || '';
    lightbox.kind = (meta && meta.kind) || 'gallery';
    renderLightbox();
    els.photoView.className = 'photo-view';
    document.body.classList.add('locked');
  }

  function lightboxStep(delta) {
    var total = (lightbox.items || []).length;
    if (total < 2) return;
    lightbox.index = (lightbox.index + delta + total) % total;
    renderLightbox();
  }

  function openPhotoView(book) {
    var photo = normalizePhoto(book && book.photo);
    if (!photo) return;
    showLightbox([{ dataUrl: photo }], 0, {
      title: (book && book.title) || '',
      subtitle: (book && book.author) || '',
      kind: 'cover'
    });
  }

  function openGalleryView(book, index) {
    var items = bookGallery(book);
    if (!items.length) { openPhotoView(book); return; }
    showLightbox(items, index || 0, {
      title: (book && book.title) || '',
      subtitle: (book && book.author) || '',
      kind: 'gallery'
    });
  }

  function closePhotoView() {
    if (!els.photoView || els.photoView.className.indexOf('hidden') !== -1) return;
    els.photoView.className = 'photo-view hidden';
    els.photoViewImg.removeAttribute('src');
    els.photoViewNote.textContent = '';
    els.photoViewCount.textContent = '';
    lightbox.items = [];
    lightbox.index = 0;
    /* 수정 시트가 열려 있으면(body 잠금 유지) 그대로 둡니다. */
    if (els.sheet && els.sheet.className.indexOf('hidden') === -1) return;
    document.body.classList.remove('locked');
  }

  function showQuotaDialog(options) {
    var opts = options || {};
    var lines = [store.mode === 'idb'
      ? '브라우저의 저장 공간이 꽉 찼어요.'
      : '브라우저에 기록을 담는 공간(약 5MB)이 꽉 찼어요.'];
    if (opts.photoKB) lines.push('이번 사진: 약 ' + formatKB(opts.photoKB));
    if (opts.galleryCount) lines.push('사진첩 사진 ' + opts.galleryCount + '장: 약 ' + formatKB(opts.galleryKB));
    if (opts.usedKB) lines.push('지금 기록: 약 ' + formatKB(opts.usedKB) + ' (추정)');
    lines.push('');
    lines.push(opts.advice || '사진을 빼고 저장하거나, ‘백업·관리’에서 JSON으로 내보낸 뒤 사진이 많은 책의 사진을 지워 주세요.');

    askDialog({
      title: '저장 공간이 가득 찼어요',
      message: lines.join('\n'),
      cancelLabel: '닫기',
      actions: opts.onRetry ? [{ label: opts.retryLabel || '사진 빼고 저장', style: 'primary', onClick: opts.onRetry }] : []
    });
  }

  function showBookQuotaDialog(data) {
    var usage = storageUsage();
    var galleryCount = (data.gallery || []).length;
    showQuotaDialog({
      photoKB: photoSizeKB(data.photo),
      galleryCount: galleryCount,
      galleryKB: galleryTotalKB(data.gallery),
      usedKB: usage.kb,
      retryLabel: galleryCount ? '사진첩 사진 빼고 저장' : '사진 빼고 저장',
      onRetry: function () {
        /* 사진첩이 있으면 사진첩만 빼고(표지는 남기고), 그래도 부족하면 표지까지 뻔다. */
        var keepCover = galleryCount ? !!normalizePhoto(state.draftPhoto) : false;
        state.draftGallery = [];
        if (!keepCover) state.draftPhoto = '';
        state.photoBusy = false;
        renderPhoto();
        renderAlbum();

        var result = applyQuotaRetry(keepCover ? '' : '사진을');
        if (result.ok) return;

        if (keepCover) {
          /* 사진첩을 빼도 안 들어가면 표지 사진까지 뻔다. */
          state.draftPhoto = '';
          renderPhoto();
          result = applyQuotaRetry('사진을 모두');
          if (result.ok) return;
        }
        toast('사진을 빼도 공간이 부족해요. JSON으로 백업한 뒤 기록을 정리해 주세요.');
      }
    });
  }

  /* 공간 부족 안내에서 “사진 빼고 저장”을 골랐을 때 지금 초안으로 다시 저장합니다. */
  function applyQuotaRetry(droppedLabel) {
    var wasEdit = state.editingId != null;
    var data = collectFormData();
    data.gallery = [];
    data.photo = normalizePhoto(state.draftPhoto);
    var result = applyData(data);
    if (!result.ok) return result;
    closeSheet();
    renderAll();
    var head = droppedLabel === '사진을 모두' ? '사진과 사진첩을 모두 빼고'
      : (droppedLabel ? '사진을 빼고' : '사진첩 사진을 빼고');
    toast(head + (wasEdit ? ' 수정했어요.' : ' 저장했어요.'));
    return result;
  }

  function showImportQuotaDialog(books, mode) {
    var photoKB = 0;
    var galleryKB = 0;
    var galleryCount = 0;
    for (var i = 0; i < books.length; i++) {
      photoKB += photoSizeKB(books[i].photo);
      galleryCount += (books[i].gallery || []).length;
      galleryKB += galleryTotalKB(books[i].gallery);
    }
    showQuotaDialog({
      photoKB: photoKB,
      galleryCount: galleryCount,
      galleryKB: galleryKB,
      retryLabel: '사진 빼고 가져오기',
      advice: '가져온 책의 사진(' + formatKB(photoKB + galleryKB) + ') 때문에 넘쳤어요.\n' +
        '사진을 빼고 가져오거나, ‘백업·관리’에서 지금 기록을 정리해 주세요.',
      onRetry: function () {
        var stripped = [];
        for (var j = 0; j < books.length; j++) {
          var copy = sanitizeBook(books[j]);
          copy.photo = '';
          copy.gallery = [];
          stripped.push(copy);
        }
        var result = applyImport(stripped, mode);
        if (!result.ok) {
          toast('사진을 빼도 공간이 부족해요. JSON으로 백업한 뒤 기록을 정리해 주세요.');
          return;
        }
        toast(state.books.length + '권을 사진 없이 가져왔어요.');
      }
    });
  }

  /* ------------------------------------------------------------------
     시트를 화면에 바르게 붙이기 (모바일 키보드 대응)
     - syncAppHeight: 지금 보이는 높이를 --app-vh 에 넣어 시트가 그 안에 들어오게
     - pinSheetScroll: 시트 상자 자체가 스크롤돼 헤더가 위로 밀리고
       버튼 줄 아래가 비는 일을 막습니다.
     ------------------------------------------------------------------ */

  function syncAppHeight() {
    var vv = window.visualViewport;
    /* 손가락으로 확대한 상태에서는 보이는 높이가 줄어드니 건드리지 않습니다. */
    if (vv && Math.abs((vv.scale || 1) - 1) > 0.01) return;
    var h = Math.round((vv && vv.height) || window.innerHeight || 0);
    if (h > 0) document.documentElement.style.setProperty('--app-vh', h + 'px');
  }

  function pinSheetScroll() {
    var sheet = els.sheet;
    if (!sheet || sheet.className.indexOf('hidden') !== -1) return;
    if (sheet.scrollTop) sheet.scrollTop = 0;
    if (sheet.scrollLeft) sheet.scrollLeft = 0;
  }

  function openSheet(book) {
    cancelAutoFillGenreTag();
    state.editingId = book ? book.id : null;
    els.sheetTitle.textContent = book ? '책 수정' : '책 추가';
    els.fTitle.value = book ? book.title : '';
    els.fAuthor.value = book ? book.author : '';
    els.fTags.value = book ? book.tags.join(', ') : '';
    els.fMemo.value = book ? book.memo : '';
    els.fDate.value = book ? book.date : todayISO();
    els.fStart.value = book ? parseDate(book.started_at, false) : '';
    state.draftStatus = book ? book.status : '완독';
    state.draftRating = book ? book.rating : 0;
    state.draftPhoto = book ? normalizePhoto(book.photo) : '';
    state.photoBusy = false;
    state.draftGallery = book ? bookGallery(book) : [];
    state.galleryBusy = false;
    state.galleryDone = 0;
    state.galleryTotal = 0;
    state.draftExifDate = '';
    state.startTouched = false;
    state.tagsTouched = false;
    state.coverBusy = false;
    state.coverError = '';
    state.coverTitle = '';
    state.coverAuthor = '';
    state.coverCategory = '';
    state.coverToken = (state.coverToken || 0) + 1;
    try { els.fPhoto.value = ''; } catch (err) {}
    try { els.fGallery.value = ''; } catch (err0) {}

    els.btnDelete.className = book ? 'btn danger' : 'btn danger hidden';

    renderSeg();
    renderStars();
    renderPhoto();
    renderAlbum();

    els.sheet.className = 'sheet';
    els.sheetBackdrop.className = 'backdrop';
    document.body.classList.add('locked');

    syncAppHeight();

    // 화면에 붙은 뒤에 스크롤을 맨 위로 (숨겨진 상태에서는 scrollTop이 되돌아간다)
    pinSheetScroll();
    if (els.sheetBody) els.sheetBody.scrollTop = 0;
    setTimeout(function () {
      pinSheetScroll();
      if (els.sheetBody) els.sheetBody.scrollTop = 0;
      if (!book) { try { els.fTitle.focus(); } catch (err) {} }
    }, 60);
  }

  function closeSheet() {
    cancelAutoFillGenreTag();
    els.sheet.className = 'sheet hidden';
    els.sheetBackdrop.className = 'backdrop hidden';
    document.body.classList.remove('locked');
    state.editingId = null;
    state.draftPhoto = '';
    state.photoBusy = false;
    state.draftGallery = [];
    state.galleryBusy = false;
    state.galleryDone = 0;
    state.galleryTotal = 0;
    state.draftExifDate = '';
    state.startTouched = false;
    state.tagsTouched = false;
    state.coverBusy = false;
    state.coverError = '';
    state.coverTitle = '';
    state.coverAuthor = '';
    state.coverCategory = '';
    state.coverToken = (state.coverToken || 0) + 1;
    try { els.fPhoto.value = ''; } catch (err) {}
    try { els.fGallery.value = ''; } catch (err1) {}
    if (document.activeElement && document.activeElement.blur) {
      try { document.activeElement.blur(); } catch (err2) {}
    }
  }

  function collectFormData() {
    return {
      title: els.fTitle.value.trim(),
      author: els.fAuthor.value.trim(),
      status: state.draftStatus,
      date: parseDate(els.fDate.value, false),
      started_at: parseDate(els.fStart.value, false),
      rating: state.draftRating,
      tags: parseTags(els.fTags.value),
      memo: els.fMemo.value.trim(),
      photo: normalizePhoto(state.draftPhoto),
      gallery: serializeGallery(state.draftGallery)
    };
  }

  function bookFromData(id, data) {
    return {
      id: id,
      title: data.title,
      author: data.author,
      status: data.status,
      date: data.date,
      started_at: data.started_at,
      rating: data.rating,
      tags: data.tags,
      memo: data.memo,
      photo: data.photo,
      gallery: data.gallery ? data.gallery.slice() : []
    };
  }

  /* 화면의 책 목록을 바꾸고 저장합니다. 저장에 실패하면 바꾼 내용을 되돌립니다. */
  function applyData(data) {
    var snapshot = { books: state.books.slice(), lastId: state.lastId };

    if (state.editingId != null) {
      var index = -1;
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id === state.editingId) { index = i; break; }
      }
      if (index === -1) return { ok: false, quota: false, message: '책을 찾지 못했어요.' };
      var next = state.books.slice();
      next[index] = bookFromData(state.editingId, data);
      state.books = next;
    } else {
      var newId = state.lastId + 1;
      state.books = state.books.concat([bookFromData(newId, data)]);
      state.lastId = newId;
    }

    var result = save();
    if (!result.ok) {
      state.books = snapshot.books;
      state.lastId = snapshot.lastId;
      return result;
    }
    /* 공유 중이면 바뀜 책을 바로 올립니다. */
    if (shared.active) {
      var saved = findBook(state.editingId != null ? state.editingId : state.lastId);
      if (saved) sharePushBook(saved);
    }
    return result;
  }

  function submitForm(event) {
    if (event && event.preventDefault) event.preventDefault();

    var title = els.fTitle.value.trim();
    if (!title) {
      toast('제목을 입력해 주세요.');
      try { els.fTitle.focus(); } catch (err) {}
      return;
    }

    if (state.photoBusy) {
      toast('사진을 줄이는 중이에요. 잠깐만 기다려 주세요.');
      return;
    }

    if (state.galleryBusy) {
      toast('사진첩 사진을 담는 중이에요. 잠깐만 기다려 주세요.');
      return;
    }

    var data = collectFormData();
    /* 태그를 비워 두었으면 제목으로 장르를 짐작해 하나 넣습니다. */
    if (!data.tags.length) {
      var guess = maybeAutoFillGenreTag();
      if (guess) data.tags = [guess];
    }
    var isEdit = state.editingId != null;
    var result = applyData(data);

    if (!result.ok) {
      if (result.quota) showBookQuotaDialog(data);
      else toast(result.message || '저장하지 못했어요.');
      return;
    }

    var savedId = isEdit ? state.editingId : state.lastId;
    closeSheet();

    if (!isEdit) {
      state.q = '';
      state.status = '전체';
      if (els.search) els.search.value = '';
      els.sort.value = state.sort;
    }

    renderAll();
    toast(isEdit ? '수정했어요.' : '책을 추가했어요. (ID ' + savedId + ')');
  }

  function deleteEditingBook() {
    var id = state.editingId;
    if (id == null) return;
    var book = findBook(id);
    if (!book) return;

    askDialog({
      title: '책 삭제',
      message: '\'' + book.title + '\' 을(를) 지울까요?\n지운 기록은 되돌릴 수 없습니다.',
      actions: [{
        label: '삭제',
        style: 'danger',
        onClick: function () {
          state.books = state.books.filter(function (b) { return b.id !== id; });
          var result = save();
          if (shared.active) shareDeleteBook(id);
          closeSheet();
          renderAll();
          toast(result.ok ? '삭제했어요.' : result.message);
        }
      }]
    });
  }

  /* ------------------------------------------------------------------
     🔗 실시간 공유 (Firebase Firestore)
     - 방 하나 = 컬렉션 bookshelves/{roomId}/books, 문서 ID = 책 번호(id)
     - 링크(?room=방ID)를 아는 사람은 같은 책장을 실시간으로 함께 봅니다.
     - Gemini API 키는 코드에도, Firestore 에도 넣지 않습니다.
     ------------------------------------------------------------------ */

  var shared = {
    active: false,
    roomId: '',
    fs: null,
    unsub: null,
    busy: false,
    error: '',
    count: 0,
    galleryBlocked: false,
    /* 사진첩은 책마다 하위 컬렉션(books/{id}/gallery)에 사진 한 장씩 나눠 담습니다. */
    rawBooks: {},       /* 책ID(문자열) → 부모 문서에서 읽은 책 (사진첩 제외) */
    inlineGallery: {},  /* 책ID → 옛 문서에 남아 있던 gallery 배열 */
    galleries: {},      /* 책ID → 하위 컬렉션에서 읽은 사진첩 */
    galleryUnsub: {},   /* 책ID → onSnapshot 해제 함수 */
    galleryReady: {},   /* 책ID → 첫 스냅샷이 도착했는지 */
    galleryMoved: {},   /* 책ID → 옛 gallery 를 하위 컬렉션으로 옮겼는지 */
    galleryError: ''
  };

  var debugLog = [];
  function dbg(msg, extra) {
    try {
      debugLog.push(new Date().toISOString().slice(11, 23) + ' ' + msg + (extra == null ? '' : ' ' + extra));
      if (debugLog.length > 300) debugLog.shift();
    } catch (e) {}
  }

  function shareConfigured() {
    var key = String(FIREBASE_CONFIG.apiKey || '');
    var project = String(FIREBASE_CONFIG.projectId || '');
    return key.length > 20 && !!project && project.indexOf('your-project') !== 0;
  }

  function normalizeRoomId(raw) {
    var text = String(raw == null ? '' : raw).toLowerCase().replace(/[^a-z0-9-]/g, '');
    return text.slice(0, 40);
  }

  function randomRoomId() {
    var alphabet = 'abcdefghijkmnpqrstuvwxyz23456789';
    var bytes = null;
    try {
      bytes = new Uint8Array(8);
      window.crypto.getRandomValues(bytes);
    } catch (e) { bytes = null; }
    var out = 'shelf-';
    for (var i = 0; i < 8; i++) {
      var n = bytes ? bytes[i] : Math.floor(Math.random() * 256);
      out += alphabet.charAt(n % alphabet.length);
    }
    return out;
  }

  function roomFromUrl() {
    var search = '';
    try { search = String(window.location.search || ''); } catch (e) { search = ''; }
    var match = search.match(/[?&]room=([^&]*)/);
    if (!match) return '';
    var value = match[1];
    try { value = decodeURIComponent(value); } catch (e2) { value = match[1]; }
    return normalizeRoomId(value);
  }

  function shareUrlFor(roomId) {
    var base = '';
    try { base = window.location.origin + window.location.pathname; } catch (e) { base = ''; }
    return base + '?room=' + encodeURIComponent(roomId);
  }

  function setShareUrl(roomId) {
    try {
      if (!window.history || !window.history.replaceState) return;
      var base = window.location.origin + window.location.pathname;
      var next = roomId ? (base + '?room=' + encodeURIComponent(roomId)) : base;
      window.history.replaceState(null, '', next + String(window.location.hash || ''));
    } catch (e) {}
  }

  function rememberRoom(roomId) {
    try {
      if (roomId) storage.set(SHARE_ROOM_KEY, roomId);
      else storage.remove(SHARE_ROOM_KEY);
    } catch (e) {}
  }

  function lastRoomId() {
    try { return normalizeRoomId(storage.get(SHARE_ROOM_KEY) || ''); } catch (e) { return ''; }
  }

  function shareErrorMessage(err) {
    var text = String((err && (err.code || err.message)) || '').toLowerCase();
    if (text.indexOf('permission-denied') !== -1) return '권한이 없어요 (firestore.rules 확인)';
    if (text.indexOf('unavailable') !== -1 || text.indexOf('offline') !== -1) return '인터넷 연결을 확인해 주세요';
    if (text.indexOf('not-found') !== -1) return 'Firestore 데이터베이스를 찾지 못했어요';
    if (text.indexOf('api-key') !== -1) return 'Firebase 설정값(apiKey)을 확인해 주세요';
    if (text.indexOf('too large') !== -1 || text.indexOf('invalid-argument') !== -1) return '내용이 너무 커서 올리지 못했어요';
    return String((err && err.message) || '알 수 없는 오류');
  }

  /* Firebase JS SDK(v10)를 필요할 때 불러옵니다. */
  function loadFirestore() {
    if (shared.fs) return Promise.resolve(shared.fs);
    var base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/';
    return import(base + 'firebase-app.js').then(function (appMod) {
      return import(base + 'firebase-firestore.js').then(function (fsMod) {
        var apps = typeof appMod.getApps === 'function' ? appMod.getApps() : [];
        var app = (apps && apps.length) ? appMod.getApp() : appMod.initializeApp(FIREBASE_CONFIG);
        shared.fs = { app: app, db: fsMod.getFirestore(app), mod: fsMod };
        return shared.fs;
      });
    });
  }

  function shareDocFor(book) {
    /* 부모 문서에는 글자·표지만 담습니다. 사진첩(gallery)은 하위 컬렉션으로 나갑니다. */
    return {
      id: toInt(book.id),
      title: String(book.title || ''),
      author: String(book.author || ''),
      status: normalizeStatus(book.status),
      date: String(book.date || ''),
      rating: toInt(book.rating),
      tags: (book.tags || []).slice(0, 40).map(function (t) { return String(t); }),
      memo: String(book.memo || ''),
      started_at: String(book.started_at || ''),
      photo: String(book.photo || ''),
      updatedAt: null
    };
  }

  /* 사진이 너무 크면 Firestore 한도 안으로 다시 줄입니다. (못 줄이면 사진만 뺍니다) */
  function shrinkPhotoForShare(dataUrl, maxChars) {
    return new Promise(function (resolve) {
      if (!dataUrl || dataUrl.length <= maxChars) { resolve(dataUrl || ''); return; }
      if (maxChars < 20000) { resolve(''); return; }
      var img = new Image();
      img.onload = function () {
        var width = img.naturalWidth || img.width;
        var height = img.naturalHeight || img.height;
        if (!width || !height) { resolve(''); return; }
        var steps = [[600, 0.7], [520, 0.62], [440, 0.55], [360, 0.5], [280, 0.45], [220, 0.4]];
        for (var i = 0; i < steps.length; i++) {
          var out = '';
          try { out = drawScaled(img, width, height, steps[i][0], steps[i][1]); } catch (e) { out = ''; }
          if (out && out.length <= maxChars) { resolve(out); return; }
        }
        resolve('');
      };
      img.onerror = function () { resolve(''); };
      img.src = dataUrl;
    });
  }

  function docChars(doc) {
    try { return JSON.stringify(doc).length; } catch (e) { return 0; }
  }

  /* 부모 문서(책) — 글자·표지만. 1MB 한도 안에 넉넉히 들어갑니다. */
  function prepareShareDoc(book) {
    var doc = shareDocFor(book);
    if (docChars(doc) <= SHARE_DOC_MAX_CHARS) {
      return Promise.resolve({ doc: doc, photoDropped: false });
    }
    /* 표지 사진을 한도 안으로 줄이고, 안 되면 공유본에서 뺍니다. */
    var room = SHARE_DOC_MAX_CHARS - (docChars(doc) - String(doc.photo).length) - 2000;
    return shrinkPhotoForShare(doc.photo, Math.max(0, room)).then(function (small) {
      doc.photo = small || '';
      return { doc: doc, photoDropped: !small };
    });
  }

  /* 사진첩 사진 한 장 → 하위 컬렉션 문서.
     규칙: { id: string, dataUrl: string ≤ 900KB, note?: string ≤ 120자,
              addedAt: timestamp, updatedAt: timestamp } */
  function prepareGalleryDoc(item, mod) {
    var url = String((item && item.dataUrl) || '');
    if (!url) return Promise.resolve(null);
    var fit = url.length <= SHARE_GALLERY_MAX_CHARS
      ? Promise.resolve(url)
      : shrinkPhotoForShare(url, SHARE_GALLERY_MAX_CHARS - 1000);
    return fit.then(function (small) {
      if (!small) return null;
      var doc = {
        id: normalizeGalleryId(item.id) || galleryId(),
        dataUrl: small,
        addedAt: galleryTimestamp(item.addedAt, mod),
        updatedAt: mod.serverTimestamp()
      };
      var note = normalizeGalleryNote(item.note);
      if (note) doc.note = note;
      return doc;
    });
  }

  /* addedAt 은 timestamp 로 보냅니다(규칙: is timestamp). */
  function galleryTimestamp(value, mod) {
    var date = value ? new Date(value) : new Date();
    if (isNaN(date.getTime())) date = new Date();
    try {
      if (mod && mod.Timestamp && typeof mod.Timestamp.fromDate === 'function') {
        return mod.Timestamp.fromDate(date);
      }
    } catch (e) {}
    try { return mod.serverTimestamp(); } catch (e2) {}
    return date;
  }

  /* 하위 컬렉션 문서 → 앱의 사진첩 항목 */
  function galleryItemFromDoc(data) {
    var raw = data || {};
    var url = String(raw.dataUrl || '');
    if (!url) return null;
    var item = { id: normalizeGalleryId(raw.id) || galleryId(), dataUrl: url };
    var note = normalizeGalleryNote(raw.note);
    if (note) item.note = note;
    var added = raw.addedAt;
    if (added && typeof added.toDate === 'function') {
      try { item.addedAt = added.toDate().toISOString(); } catch (e) {}
    } else if (added) {
      var date = new Date(added);
      if (!isNaN(date.getTime())) item.addedAt = date.toISOString();
    }
    return item;
  }

  function gallerySort(a, b) {
    var at = a && a.addedAt ? new Date(a.addedAt).getTime() : 0;
    var bt = b && b.addedAt ? new Date(b.addedAt).getTime() : 0;
    if (isNaN(at)) at = 0;
    if (isNaN(bt)) bt = 0;
    if (at !== bt) return at - bt;
    return String((a && a.id) || '').localeCompare(String((b && b.id) || ''));
  }

  /* 하위 컬렉션 사진 + 옛 문서에 남아 있던 gallery 를 합칩니다(같은 사진은 한 번만). */
  function mergeGalleryLists(sub, inline) {
    var out = [];
    var seenUrl = {};
    var seenId = {};
    var lists = [sub || [], inline || []];
    for (var l = 0; l < lists.length; l++) {
      for (var i = 0; i < lists[l].length; i++) {
        var item = lists[l][i];
        if (!item || !item.dataUrl) continue;
        if (seenUrl[item.dataUrl]) continue;
        if (item.id && seenId[item.id]) continue;
        seenUrl[item.dataUrl] = true;
        if (item.id) seenId[item.id] = true;
        out.push(item);
      }
    }
    return sanitizeGallery(out);
  }

  /* 부모 문서 스냅샷 + 책마다의 사진첩 스냅샷으로 이 방의 책장을 다시 만듭니다. */
  function rebuildSharedBooks() {
    var ids = [];
    for (var key in shared.rawBooks) {
      if (Object.prototype.hasOwnProperty.call(shared.rawBooks, key)) ids.push(key);
    }
    ids.sort(function (a, b) { return toInt(a) - toInt(b); });
    var list = [];
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var book = shared.rawBooks[id];
      book.gallery = mergeGalleryLists(shared.galleries[id], shared.inlineGallery[id]);
      list.push(book);
    }
    state.books = list;
    var maxId = 0;
    for (var j = 0; j < list.length; j++) {
      if (list[j].id > maxId) maxId = list[j].id;
    }
    state.lastId = maxId;
    shared.count = list.length;
  }

  function galleryWriteError(err) {
    dbg('gallery error', String((err && (err.code || err.message)) || err));
    shared.galleryError = shareErrorMessage(err);
    if (isPermissionDenied(err)) {
      shared.galleryBlocked = true;
      toast('사진첩은 아직 공유 규칙(firestore.rules)에 없어 이 기기에만 남습니다.');
    } else {
      toast('사진첩 공유 실패: ' + shared.galleryError);
    }
    if (state.view === 'backup') syncSharePanel();
  }

  /* 방의 한 책에 붙은 사진첩 하위 컬렉션을 실시간으로 따라갑니다. */
  function shareSubscribeGallery(bookId) {
    var key = String(bookId);
    if (shared.galleryUnsub[key] || !shared.active || !shared.fs) return;
    var fs = shared.fs;
    var mod = fs.mod;
    var col = mod.collection(fs.db, SHARE_COLLECTION, shared.roomId, 'books', key, SHARE_GALLERY_COLLECTION);
    var unsub = mod.onSnapshot(col, function (snap) {
      if (!shared.active || !shared.roomId) return;
      var items = [];
      snap.forEach(function (docSnap) {
        var item = galleryItemFromDoc(docSnap.data());
        if (item) items.push(item);
      });
      items.sort(gallerySort);
      shared.galleries[key] = items;
      shared.galleryReady[key] = true;
      shared.galleryError = '';
      rebuildSharedBooks();
      renderAll();
      if (state.view === 'backup') syncSharePanel();
      moveInlineGallery(key);
    }, function (err) {
      shared.galleryError = shareErrorMessage(err);
      if (isPermissionDenied(err)) shared.galleryBlocked = true;
      if (state.view === 'backup') syncSharePanel();
    });
    shared.galleryUnsub[key] = unsub;
  }

  /* 책이 늘면 사진첩 구독을 붙이고, 사라진 책의 구독은 뗍니다. */
  function syncGallerySubscriptions() {
    var keep = {};
    for (var key in shared.rawBooks) {
      if (!Object.prototype.hasOwnProperty.call(shared.rawBooks, key)) continue;
      keep[key] = true;
      shareSubscribeGallery(key);
    }
    for (var booked in shared.galleryUnsub) {
      if (!Object.prototype.hasOwnProperty.call(shared.galleryUnsub, booked)) continue;
      if (keep[booked]) continue;
      try { shared.galleryUnsub[booked](); } catch (e) {}
      delete shared.galleryUnsub[booked];
      delete shared.galleries[booked];
      delete shared.galleryReady[booked];
      delete shared.inlineGallery[booked];
      delete shared.galleryMoved[booked];
    }
  }

  function shareDetachGalleries() {
    for (var key in shared.galleryUnsub) {
      if (!Object.prototype.hasOwnProperty.call(shared.galleryUnsub, key)) continue;
      try { shared.galleryUnsub[key](); } catch (e) {}
    }
    shared.galleryUnsub = {};
    shared.galleries = {};
    shared.galleryReady = {};
    shared.galleryMoved = {};
    shared.galleryError = '';
    shared.rawBooks = {};
    shared.inlineGallery = {};
  }

  /* 옛 문서에 사진첩이 통째로 들어 있으면(gallery 배열) 하위 컬렉션으로 한 번 옮깁니다. */
  function moveInlineGallery(bookId) {
    var key = String(bookId);
    if (shared.galleryMoved[key]) return;
    var inline = shared.inlineGallery[key] || [];
    if (!inline.length) return;
    shared.galleryMoved[key] = true;
    var have = {};
    var current = shared.galleries[key] || [];
    for (var i = 0; i < current.length; i++) have[current[i].dataUrl] = true;
    var items = [];
    for (var j = 0; j < inline.length; j++) {
      if (!have[inline[j].dataUrl]) items.push(inline[j]);
    }
    if (!items.length) return;
    syncGalleryItems(key, items, current);
  }

  /* 사진첩 하위 컬렉션을 원하는 목록에 맞춥니다.
     새 사진은 쓰고, 메모가 바뀐 사진은 고치고, 빠진 사진은 지웁니다. */
  function syncGalleryItems(bookId, wanted, current) {
    if (!shared.active || !shared.fs) return Promise.resolve();
    var fs = shared.fs;
    var mod = fs.mod;
    var key = String(bookId);
    var room = shared.roomId;
    var now = current || shared.galleries[key] || [];
    var have = {};
    for (var i = 0; i < now.length; i++) have[String(now[i].id)] = now[i];
    var items = sanitizeGallery(wanted);
    var keep = {};
    var jobs = [];
    dbg('sync start', key + ' wanted=' + (wanted || []).length + ' items=' + items.length +
      ' have=' + now.length + ' ids=' + items.map(function (x) { return x.id; }).join(','));
    for (var j = 0; j < items.length; j++) {
      (function (item) {
        keep[String(item.id)] = true;
        var old = have[String(item.id)];
        if (old && old.dataUrl === item.dataUrl && String(old.note || '') === String(item.note || '')) return;
        jobs.push(prepareGalleryDoc(item, mod).then(function (doc) {
          if (!doc) {
            toast('사진첩 사진 한 장은 너무 커서 공유본에서 뺐어요.');
            return null;
          }
          if (!shared.active || shared.roomId !== room) return null;
          var ref = mod.doc(fs.db, SHARE_COLLECTION, room, 'books', key, SHARE_GALLERY_COLLECTION, doc.id);
          dbg('setDoc gallery', key + '/' + doc.id + ' len=' + doc.dataUrl.length);
          return mod.setDoc(ref, doc).then(function (r) { dbg('setDoc ok', key + '/' + doc.id); return r; })
            .catch(galleryWriteError);
        }));
      })(items[j]);
    }
    var gone = [];
    for (var oldId in have) {
      if (!Object.prototype.hasOwnProperty.call(have, oldId)) continue;
      if (!keep[oldId]) gone.push(oldId);
    }
    for (var g = 0; g < gone.length; g++) {
      (function (oldId) {
        if (!shared.active || shared.roomId !== room) return;
        var ref = mod.doc(fs.db, SHARE_COLLECTION, room, 'books', key, SHARE_GALLERY_COLLECTION, oldId);
        dbg('deleteDoc gallery', key + '/' + oldId);
        jobs.push(mod.deleteDoc(ref).catch(galleryWriteError));
      })(gone[g]);
    }
    return Promise.all(jobs);
  }

  function sharePushBook(book) {
    if (!shared.active || !shared.fs) return Promise.resolve();
    var fs = shared.fs;
    var mod = fs.mod;
    /* 사진첩은 책 아래 하위 컬렉션(books/{id}/gallery)에 사진 한 장씩 담습니다.
       부모 문서와 서로 다른 문서라, 부모 저장 응답을 기다리지 않고 바로 올립니다. */
    dbg('push book', String(book.id) + ' gallery=' + (book.gallery || []).length);
    var galleryJob = syncGalleryItems(book.id, book.gallery || [],
                                      shared.galleries[String(book.id)] || []);
    var bookJob = prepareShareDoc(book).then(function (prepared) {
      if (prepared.photoDropped) toast('사진이 너무 커서 공유본에서는 뺐어요.');
      var doc = prepared.doc;
      doc.updatedAt = mod.serverTimestamp();
      return writeShareDoc(mod, fs, book, doc);
    }).catch(function (err) {
      shared.error = shareErrorMessage(err);
      toast('공유 저장 실패: ' + shared.error);
      if (state.view === 'backup') renderBackup();
    });
    return Promise.all([bookJob, galleryJob]);
  }

  function writeShareDoc(mod, fs, book, doc) {
    var ref = mod.doc(fs.db, SHARE_COLLECTION, shared.roomId, 'books', String(book.id));
    return mod.setDoc(ref, doc);
  }

  function isPermissionDenied(err) {
    var text = String((err && (err.code || err.message)) || '').toLowerCase();
    return text.indexOf('permission-denied') !== -1;
  }

  /* 책 하나와 그 사진첩(하위 컬렉션 문서들)을 함께 지웁니다. */
  function deleteSharedBookTree(mod, fs, bookId) {
    var key = String(bookId);
    var col = mod.collection(fs.db, SHARE_COLLECTION, shared.roomId, 'books', key, SHARE_GALLERY_COLLECTION);
    return mod.getDocs(col).then(function (snap) {
      var jobs = [];
      snap.forEach(function (docSnap) { jobs.push(mod.deleteDoc(docSnap.ref)); });
      return Promise.all(jobs);
    }).catch(function () {
      /* 사진첩이 규칙에 없거나 못 읽어도 책 문서는 지웁니다. */
      return null;
    }).then(function () {
      return mod.deleteDoc(mod.doc(fs.db, SHARE_COLLECTION, shared.roomId, 'books', key));
    });
  }

  function shareDeleteBook(id) {
    if (!shared.active || !shared.fs) return Promise.resolve();
    var fs = shared.fs;
    return deleteSharedBookTree(fs.mod, fs, id).catch(function (err) {
      shared.error = shareErrorMessage(err);
      toast('공유 삭제 실패: ' + shared.error);
    });
  }

  /* 이 기기의 책장 전체를 공유 방에 맞춥니다(방에만 있고 여기 없는 책은 사진첩까지 지움). */
  function sharePushAll(list) {
    if (!shared.active || !shared.fs) return Promise.resolve();
    var fs = shared.fs;
    var mod = fs.mod;
    var books = (list || state.books).slice();
    var keep = {};
    for (var i = 0; i < books.length; i++) keep[String(books[i].id)] = true;
    var col = mod.collection(fs.db, SHARE_COLLECTION, shared.roomId, 'books');
    return mod.getDocs(col).then(function (snap) {
      var jobs = [];
      snap.forEach(function (docSnap) {
        if (!keep[docSnap.id]) jobs.push(deleteSharedBookTree(mod, fs, docSnap.id));
      });
      return Promise.all(jobs);
    }).then(function () {
      var jobs = books.map(function (book) { return sharePushBook(book); });
      return Promise.all(jobs);
    }).catch(function (err) {
      shared.error = shareErrorMessage(err);
      toast('공유 올리기 실패: ' + shared.error);
    });
  }

  function shareUnsubscribe() {
    if (shared.unsub) {
      try { shared.unsub(); } catch (e) {}
      shared.unsub = null;
    }
  }

  function shareSubscribe() {
    var fs = shared.fs;
    if (!fs) return;
    shareUnsubscribe();
    var mod = fs.mod;
    var col = mod.collection(fs.db, SHARE_COLLECTION, shared.roomId, 'books');
    shared.unsub = mod.onSnapshot(col, function (snap) {
      if (!shared.active) return;
      var rawBooks = {};
      var inlineGallery = {};
      snap.forEach(function (docSnap) {
        var data = docSnap.data() || {};
        var book = sanitizeBook({
          id: data.id != null ? data.id : docSnap.id,
          title: data.title,
          author: data.author,
          status: data.status,
          date: data.date,
          started_at: data.started_at,
          rating: data.rating,
          tags: data.tags,
          memo: data.memo,
          photo: data.photo
        });
        if (!book.id) book.id = toInt(docSnap.id);
        var key = String(book.id);
        book.gallery = [];
        rawBooks[key] = book;
        /* 옛 문서에는 사진첩이 통째로 들어 있었습니다 — 읽을 때만 합쳐 줍니다. */
        var inline = sanitizeGallery(data.gallery);
        if (inline.length) inlineGallery[key] = inline;
      });
      shared.rawBooks = rawBooks;
      shared.inlineGallery = inlineGallery;
      rebuildSharedBooks();
      syncGallerySubscriptions();
      shared.error = '';
      renderAll();
      if (state.view === 'backup') syncSharePanel();
    }, function (err) {
      shared.error = shareErrorMessage(err);
      toast('공유 연결 오류: ' + shared.error);
      if (state.view === 'backup') syncSharePanel();
    });
  }

  function syncSharePanel() {
    var panel = document.getElementById('share-panel');
    if (!panel) return;
    var fresh = document.createElement('div');
    fresh.innerHTML = sharePanelHTML();
    if (fresh.firstChild && panel.parentNode) {
      panel.parentNode.replaceChild(fresh.firstChild, panel);
    }
  }

  function startShare(roomId, options) {
    var opts = options || {};
    if (shared.busy) return;
    if (!shareConfigured()) {
      toast('Firebase 설정값이 비어 있어 공유를 쓸 수 없어요.');
      return;
    }
    var room = normalizeRoomId(roomId) || randomRoomId();
    var upload = opts.upload ? state.books.slice() : null;
    shared.busy = true;
    shared.error = '';
    shared.galleryBlocked = false;
    if (state.view === 'backup') syncSharePanel();

    loadFirestore().then(function () {
      shareDetachGalleries();
      shared.roomId = room;
      shared.active = true;
      shared.busy = false;
      shared.count = 0;
      rememberRoom(room);
      setShareUrl(room);
      shareSubscribe();
      renderAll();
      if (state.view === 'backup') syncSharePanel();
      if (upload) sharePushAll(upload);
      toast(upload ? '공유를 시작했어요. 링크를 복사해 보내 보세요.' : '공유 책장에 연결했어요.');
      if (state.view === 'backup') syncSharePanel();
      return null;
    }).catch(function (err) {
      shared.active = false;
      shared.roomId = '';
      shared.busy = false;
      shared.error = shareErrorMessage(err);
      toast('공유에 연결하지 못했어요. ' + shared.error);
      renderAll();
      if (state.view === 'backup') syncSharePanel();
    });
  }

  function stopShare(silent) {
    shareUnsubscribe();
    shareDetachGalleries();
    shared.active = false;
    shared.roomId = '';
    shared.busy = false;
    shared.error = '';
    shared.count = 0;
    shared.galleryBlocked = false;
    rememberRoom('');
    setShareUrl('');
    renderAll();
    load().then(function () {
      renderAll();
      if (state.view === 'backup') syncSharePanel();
    });
    if (state.view === 'backup') syncSharePanel();
    if (!silent) toast('공유 방을 나왔어요. 내 기기 기록으로 돌아왔습니다.');
  }

  function joinRoomFromInput() {
    var input = document.getElementById('share-room');
    var value = input ? String(input.value || '').trim() : '';
    if (!value) {
      toast('방 ID나 공유 링크를 넣어 주세요.');
      return;
    }
    var match = value.match(/[?&]room=([^&]+)/);
    if (match) value = match[1];
    var room = normalizeRoomId(value);
    if (!room) {
      toast('방 ID는 영문 소문자·숫자·- 로 되어 있어요.');
      return;

    startShare(room, { upload: false });

  function copyShareLink() {
    var url = shareUrlFor(shared.roomId);
    if (!shared.roomId) return;
    var done = function () { toast('공유 링크를 복사했어요.'); };
    var fail = function () { toast('복사하지 못했어요. 링크를 길게 눌러 복사해 주세요.'); };
    try {
      if (window.navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () { copyShareLinkFallback(url, done, fail); });
        return;
      }
    } catch (e) {}
    copyShareLinkFallback(url, done, fail);
  }

  function copyShareLinkFallback(url, done, fail) {
    try {
      var area = document.createElement('textarea');
      area.value = url;
      area.setAttribute('readonly', 'readonly');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      document.body.appendChild(area);
      area.select();
      var ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(area);
      if (ok) done();
      else fail();
    } catch (e) {
      fail();
    }
  }

  function downloadFile(filename, mime, text) {
    var blob = new Blob([text], { type: mime });
    var url;
    try {
      url = URL.createObjectURL(blob);
    } catch (err) {
      toast('이 브라우저에서는 파일 저장을 지원하지 않아요.');
      return false;
    }
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err2) {}
    }, 2000);
    return true;
  }

  function exportJSON() {
    if (!state.books.length) {
      toast('내보낼 책이 없어요.');
      return;
    }
    var text = JSON.stringify(makePayload(state.books, state.lastId), null, 2) + '\n';
    if (downloadFile('books.json', 'application/json;charset=utf-8', text)) {
      toast(state.books.length + '권을 books.json 으로 내보냈어요.');
    }
  }

  function exportCSV() {
    if (!state.books.length) {
      toast('내보낼 책이 없어요.');
      return;
    }
    var now = new Date();
    var stamp = '' + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate());
    if (downloadFile('books_export_' + stamp + '.csv', 'text/csv;charset=utf-8', toCSV(state.books))) {
      toast(state.books.length + '권을 CSV로 내보냈어요.');
    }
  }

  function applyImport(incoming, mode) {
    var snapshot = { books: state.books.slice(), lastId: state.lastId };

    if (mode === 'replace') {
      var fresh = normalizePayload(incoming.map(serializeBook));
      state.books = fresh.books;
      state.lastId = fresh.lastId;
    } else {
      var known = {};
      for (var i = 0; i < state.books.length; i++) known[bookKey(state.books[i])] = true;
      var nextId = state.lastId;
      var merged = state.books.slice();
      for (var j = 0; j < incoming.length; j++) {
        var candidate = sanitizeBook(incoming[j]);
        var key = bookKey(candidate);
        if (known[key]) continue;
        nextId += 1;
        candidate.id = nextId;
        merged.push(candidate);
        known[key] = true;
      }
      state.books = merged;
      state.lastId = nextId;
    }

    var result = save();
    if (!result.ok) {
      state.books = snapshot.books;
      state.lastId = snapshot.lastId;
      return result;
    }

    if (shared.active) sharePushAll(state.books);

    state.q = '';
    state.status = '전체';
    if (els.search) els.search.value = '';
    setView('shelf');
    renderAll();
    return result;
  }

  function handleImportFile(file) {
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result == null ? '' : reader.result).replace(/^\uFEFF/, '');
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (err) {
        askDialog({
          title: '가져오기 실패',
          message: 'JSON 형식이 아니어서 읽을 수 없어요.\nbook_tracker.py 가 만든 books.json 파일인지 확인해 주세요.'
        });
        return;
      }

      var norm = normalizePayload(parsed);
      if (!norm.books.length) {
        toast('가져올 책이 없어요.');
        return;
      }

      askDialog({
        title: '가져오기',
        message: norm.books.length + '권을 찾았어요. 지금 기록(' + state.books.length + '권)에 어떻게 넣을까요?\n\n' +
          '· 병합 — 지금 기록은 그대로 두고, 없는 책만 추가합니다.\n' +
          '· 덮어쓰기 — 지금 기록을 모두 지우고 파일 내용으로 바꿉니다.',
        actions: [
          {
            label: '병합하기',
            style: 'primary',
            onClick: function () {
              var before = state.books.length;
              var result = applyImport(norm.books, 'merge');
              if (!result.ok) {
                if (result.quota) showImportQuotaDialog(norm.books, 'merge');
                else toast(result.message);
                return;
              }
              var added = state.books.length - before;
              toast(added + '권을 추가했어요. (' + (norm.books.length - added) + '권은 이미 있어서 건너뜀)');
            }
          },
          {
            label: '덮어쓰기',
            style: 'danger',
            onClick: function () {
              var result = applyImport(norm.books, 'replace');
              if (!result.ok) {
                if (result.quota) showImportQuotaDialog(norm.books, 'replace');
                else toast(result.message);
                return;
              }
              toast(state.books.length + '권으로 바꿨어요.');
            }
          }
        ]
      });
    };

    reader.onerror = function () {
      toast('파일을 읽지 못했어요.');
    };

    reader.readAsText(file, 'utf-8');
  }

  function clearAll() {
    if (!state.books.length) {
      toast('이미 비어 있어요.');
      return;
    }
    askDialog({
      title: '모든 기록 삭제',

      actions: [{
        label: '모두 삭제',

        onClick: function () {

          state.lastId = 0;
          state.q = '';
          state.status = '전체';
          if (els.search) els.search.value = '';

          setView('shelf');
          renderAll();
          toast(result.ok ? '모든 기록을 지웠어요.' : result.message);
        }
      }]
    });
  }
