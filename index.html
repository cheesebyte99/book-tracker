  function bind() {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) TAB_BUTTONS.push(tabs[i]);

    for (var j = 0; j < TAB_BUTTONS.length; j++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          setView(btn.getAttribute('data-view'));
        });
      })(TAB_BUTTONS[j]);
    }

    els.fab.addEventListener('click', function () { openSheet(null); });
    els.sheetClose.addEventListener('click', closeSheet);
    els.sheetBackdrop.addEventListener('click', closeSheet);
    /* 키보드·화면 돌리기로 보이는 높이가 달라질 때마다 시트를 다시 맞춥니다. */
    window.addEventListener('resize', function () { syncAppHeight(); pinSheetScroll(); });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { syncAppHeight(); pinSheetScroll(); }, 250);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        syncAppHeight();
        pinSheetScroll();
      });
      window.visualViewport.addEventListener('scroll', pinSheetScroll);
    }
    els.sheet.addEventListener('scroll', pinSheetScroll);
    els.sheet.addEventListener('focusin', pinSheetScroll);
    els.form.addEventListener('submit', submitForm);
    els.btnDelete.addEventListener('click', deleteEditingBook);
    els.dateClear.addEventListener('click', function () {
      els.fDate.value = '';
      renderCover();
    });
    els.startClear.addEventListener('click', function () {
      els.fStart.value = '';
      state.startTouched = true;
      renderExif();
      renderCover();
    });
    /* 태그를 직접 고쳤으면 자동 태그로 덮어쓰지 않습니다. */
    els.fTags.addEventListener('input', function () {
      state.tagsTouched = true;
      renderCover();
    });
    /* 제목·저자를 치는 동안(250ms 쉬었다가)과 칸을 떠날 때,
       태그 칸이 비어 있으면 장르를 넣어 둡니다. (휴대폰은 blur 전에 태그 칸을 보게 됩니다) */
    els.fTitle.addEventListener('input', function () {
      renderCover();
      scheduleAutoFillGenreTag();
    });
    els.fAuthor.addEventListener('input', function () {
      renderCover();
      scheduleAutoFillGenreTag();
    });
    els.fTitle.addEventListener('change', maybeAutoFillGenreTag);
    els.fTitle.addEventListener('blur', maybeAutoFillGenreTag);
    els.fAuthor.addEventListener('change', maybeAutoFillGenreTag);
    els.fAuthor.addEventListener('blur', maybeAutoFillGenreTag);
    els.fStart.addEventListener('input', function () {
      state.startTouched = true;
      renderExif();
    });
    els.fStart.addEventListener('change', function () {
      state.startTouched = true;
      renderExif();
    });
    els.dialogBackdrop.addEventListener('click', closeDialog);

    els.btnPhotoClear.addEventListener('click', function () {
      state.draftPhoto = '';
      state.photoBusy = false;
      state.draftExifDate = '';
      state.coverBusy = false;
      state.coverError = '';
      state.coverTitle = '';
      state.coverAuthor = '';
      state.coverCategory = '';
      state.coverToken = (state.coverToken || 0) + 1;
      try { els.fPhoto.value = ''; } catch (err) {}
      renderPhoto();
      toast('사진을 뺐어요. 저장을 누르면 반영됩니다.');
    });

    els.photoViewClose.addEventListener('click', closePhotoView);
    els.photoViewPrev.addEventListener('click', function () { lightboxStep(-1); });
    els.photoViewNext.addEventListener('click', function () { lightboxStep(1); });
    els.photoView.addEventListener('click', function (event) {
      if (event.target === els.photoView || event.target === els.photoViewImg.parentNode) closePhotoView();
    });

    els.search.addEventListener('input', function () {
      state.q = els.search.value;
      renderShelf();
    });

    els.searchClear.addEventListener('click', function () {
      state.q = '';
      els.search.value = '';
      renderShelf();
      try { els.search.focus(); } catch (err) {}
    });

    els.sort.addEventListener('change', function () {
      state.sort = els.sort.value;
      renderShelf();
    });

    document.addEventListener('click', function (event) {
      var target = event.target;
      var node = target && target.closest ? target.closest('[data-action]') : null;
      if (!node) return;
      var action = node.getAttribute('data-action');

      if (action === 'edit') {
        var id = parseInt(node.getAttribute('data-id'), 10);
        var book = findBook(id);
        if (book) openSheet(book);
        return;
      }
      if (action === 'photo') {
        openPhotoView(findBook(parseInt(node.getAttribute('data-id'), 10)));
        return;
      }
      if (action === 'album') {
        openGalleryView(findBook(parseInt(node.getAttribute('data-id'), 10)), 0);
        return;
      }
      if (action === 'album-photo') {
        var albumIndex = parseInt(node.getAttribute('data-index'), 10);
        showLightbox(state.draftGallery || [], albumIndex, {
          title: els.fTitle.value.trim() || (state.editingId != null ? '사진첩' : '새 책 사진첩'),
          subtitle: els.fAuthor.value.trim(),
          kind: 'draft'
        });
        return;
      }
      if (action === 'album-del') {
        var delIndex = parseInt(node.getAttribute('data-index'), 10);
        if (removeDraftGalleryItem(delIndex)) {
          renderAlbum();
          toast('사진을 사진첩에서 뺐어요. 저장을 누르면 반영됩니다.');
        }
        return;
      }
      if (action === 'open-new') { openSheet(null); return; }
      if (action === 'filter') {
        state.status = node.getAttribute('data-status');
        renderShelf();
        return;
      }
      if (action === 'reset-filters') {
        state.q = '';
        state.status = '전체';
        if (els.search) els.search.value = '';
        renderShelf();
        return;
      }
      if (action === 'status') {
        state.draftStatus = node.getAttribute('data-status');
        renderSeg();
        return;
      }
      if (action === 'star') {
        var v = parseInt(node.getAttribute('data-v'), 10);
        state.draftRating = (state.draftRating === v) ? 0 : v;
        renderStars();
        return;
      }
      if (action === 'use-exif-start') {
        var exifISO = parseDate(state.draftExifDate, false);
        if (exifISO) {
          els.fStart.value = exifISO;
          state.startTouched = true;
          renderExif();
          renderCover();
          toast('사진 촬영일(' + exifISO + ')을 독서 시작일에 넣었어요.');
        }
        return;
      }
      if (action === 'use-cover') {
        if (state.coverTitle) els.fTitle.value = state.coverTitle;
        if (state.coverAuthor) els.fAuthor.value = state.coverAuthor;
        if (state.coverCategory) addTagIfAllowed(state.coverCategory);
        renderCover();
        toast('표지에서 읽은 내용으로 채웠어요.');
        return;
      }
      if (action === 'gemini-save') { saveGeminiKeyFromInput(); return; }
      if (action === 'share-start') { startShare(randomRoomId(), { upload: true }); return; }
      if (action === 'share-copy') { copyShareLink(); return; }
      if (action === 'share-leave') { stopShare(); return; }
      if (action === 'share-join') { joinRoomFromInput(); return; }
      if (action === 'share-rejoin') { startShare(node.getAttribute('data-room'), { upload: false }); return; }
      if (action === 'gemini-clear') { clearGeminiKeyFromUI(); return; }
      if (action === 'gemini-toggle') { toggleGeminiVisibility(); return; }
      if (action === 'export-json') { exportJSON(); return; }
      if (action === 'export-csv') { exportCSV(); return; }
      if (action === 'clear-all') { clearAll(); return; }
    });

    document.addEventListener('keydown', function (event) {
      var key = event.key;
      var noteTarget = event.target && event.target.getAttribute
        ? event.target.getAttribute('data-gallery-note') : null;
      /* 사진 메모 칸에서 Enter 는 저장이 아니라 입력 끝으로 봅니다. */
      if (key === 'Enter' && noteTarget) {
        event.preventDefault();
        try { event.target.blur(); } catch (noteErr) {}
        return;
      }
      if (els.photoView.className.indexOf('hidden') === -1 && (key === 'ArrowLeft' || key === 'ArrowRight')) {
        event.preventDefault();
        lightboxStep(key === 'ArrowLeft' ? -1 : 1);
        return;
      }
      if (key === 'Escape') {
        if (els.photoView.className.indexOf('hidden') === -1) { closePhotoView(); return; }
        if (els.dialog.className.indexOf('hidden') === -1) { closeDialog(); return; }
        if (els.sheet.className.indexOf('hidden') === -1) { closeSheet(); return; }
        return;
      }
      if (key === 'Enter' || key === ' ') {
        var photoNode = event.target && event.target.closest ? event.target.closest('[data-action="photo"]') : null;
        if (photoNode) {
          event.preventDefault();
          openPhotoView(findBook(parseInt(photoNode.getAttribute('data-id'), 10)));
          return;
        }
        var node = event.target && event.target.closest ? event.target.closest('[data-action="edit"]') : null;
        if (node) {
          event.preventDefault();
          var book = findBook(parseInt(node.getAttribute('data-id'), 10));
          if (book) openSheet(book);
        }
      }
    });

    document.addEventListener('change', function (event) {
      var target = event.target;
      if (!target) return;
      if (target.id === 'import-input') {
        var file = target.files && target.files[0];
        handleImportFile(file);
        return;
      }
      if (target.id === 'f-photo') {
        var picked = target.files && target.files[0];
        /* 같은 사진을 다시 고를 수 있도록 입력값은 바로 닫습니다. */
        try { target.value = ''; } catch (err) {}
        handlePhotoFile(picked);
        return;
      }
      if (target.id === 'f-gallery') {
        var pickedGallery = [];
        for (var gi = 0; gi < (target.files ? target.files.length : 0); gi++) {
          pickedGallery.push(target.files[gi]);
        }
        try { target.value = ''; } catch (err2) {}
        handleGalleryFiles(pickedGallery);
      }
    });

    /* 사진첩 사진 메모는 치는 대로 초안에 담아 둡니다(다시 그리지 않아 커서가 안 튀어요). */
    document.addEventListener('input', function (event) {
      var target = event.target;
      if (!target || !target.getAttribute) return;
      var gid = target.getAttribute('data-gallery-note');
      if (!gid) return;
      setDraftGalleryNote(gid, target.value);
    });
  }

  var booted = false;
  var ready = null;

  function init() {
    if (booted) return;
    booted = true;
    bind();
    syncAppHeight();

    /* 첫 화면은 옛 localStorage 사본으로 바로 그리고, IndexedDB 를 읽은 뒤에 맞춥니다. */
    var early = readLocalLibrary();
    if (early.payload) applyLibrary(early.payload);
    readMeta();
    setView('shelf');
    renderAll();

    ready = load(early).then(function () {
      store.ready = true;
      renderAll();
      if (state.loadWarning) setTimeout(function () { toast(state.loadWarning); }, 400);
      if (store.migrated) {
        setTimeout(function () {
          toast('기존 기록 ' + store.migrated + '권을 IndexedDB 로 옮겼어요. 이제 사진을 더 넣을 수 있습니다.');
        }, 700);
      }
      refreshStorageEstimate();

      /* 공유 링크(?room=...)로 열렸으면 바로 실시간 공유 모드로 시작합니다. */
      var linkedRoom = roomFromUrl();
      if (linkedRoom) {
        if (shareConfigured()) startShare(linkedRoom, { upload: false });
        else setTimeout(function () { toast('공유 링크지만 Firebase 설정이 없어 이 기기 기록으로 열었어요.'); }, 500);
      }
      return state;
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* 테스트/디버깅용 (앱 동작에는 쓰이지 않습니다) */
  window.BookTracker = {
    STORAGE_KEY: STORAGE_KEY,
    META_KEY: META_KEY,
    IDB_NAME: IDB_NAME,
    IDB_STORE: IDB_STORE,
    IDB_KEY: IDB_KEY,
    MIGRATED_KEY: MIGRATED_KEY,
    STATUSES: STATUSES,
    state: state,
    normalizeStatus: normalizeStatus,
    parseTags: parseTags,
    GENRES: GENRES,
    inferGenreTag: inferGenreTag,
    normalizeGenre: normalizeGenre,
    addTagIfAllowed: addTagIfAllowed,
    autoTagFromTitle: autoTagFromTitle,
    parseRating: parseRating,
    parseDate: parseDate,
    sanitizeBook: sanitizeBook,
    normalizePayload: normalizePayload,
    makePayload: makePayload,
    computeStats: computeStats,
    searchBooks: searchBooks,
    sortBooks: sortBooks,
    toCSV: toCSV,
    normalizePhoto: normalizePhoto,
    photoSizeKB: photoSizeKB,
    sanitizeGallery: sanitizeGallery,
    serializeGallery: serializeGallery,
    normalizeGalleryPhoto: normalizeGalleryPhoto,
    compressGalleryImage: compressGalleryImage,
    decodeImage: decodeImage,
    decodeWithElement: decodeWithElement,
    isInAppBrowser: isInAppBrowser,
    prepareShareDoc: prepareShareDoc,
    writeShareDoc: writeShareDoc,
    SHARE_DOC_MAX_CHARS: SHARE_DOC_MAX_CHARS,
    galleryTotalKB: galleryTotalKB,
    GALLERY_MAX_COUNT: GALLERY_MAX_COUNT,
    GALLERY_MAX_CHARS: GALLERY_MAX_CHARS,
    GALLERY_NOTE_MAX: GALLERY_NOTE_MAX,
    compressImage: compressImage,
    exifDateToISO: exifDateToISO,
    extractExifDate: extractExifDate,
    parseCoverAnswer: parseCoverAnswer,
    coverRawText: coverRawText,
    coverAnswerReason: coverAnswerReason,
    coverErrorMessage: coverErrorMessage,
    getGeminiKey: getGeminiKey,
    GEMINI_KEY_STORAGE: GEMINI_KEY_STORAGE,
    GEMINI_MODEL: GEMINI_MODEL,
    GEMINI_MODELS: GEMINI_MODELS,
    GEMINI_URL: GEMINI_URL,
    storageUsage: storageUsage,
    storageState: storageState,
    readPersisted: readPersisted,
    formatBytes: formatBytes,
    storageUsageText: storageUsageText,
    refreshStorageEstimate: refreshStorageEstimate,
    galleryWarnChars: galleryWarnChars,
    mergeGalleryLists: mergeGalleryLists,
    galleryItemFromDoc: galleryItemFromDoc,
    prepareGalleryDoc: prepareGalleryDoc,
    syncGalleryItems: syncGalleryItems,
    shareGalleryPath: SHARE_GALLERY_COLLECTION,
    SHARE_GALLERY_MAX_CHARS: SHARE_GALLERY_MAX_CHARS,
    debugLog: function () { return debugLog.slice(); },
    shareState: function () {
      var out = {
        active: shared.active,
        roomId: shared.roomId,
        error: shared.error,
        galleryError: shared.galleryError,
        galleryBlocked: shared.galleryBlocked,
        books: [],
        galleries: {}
      };
      for (var key in shared.rawBooks) {
        if (Object.prototype.hasOwnProperty.call(shared.rawBooks, key)) out.books.push(key);
      }
      for (var gkey in shared.galleries) {
        if (!Object.prototype.hasOwnProperty.call(shared.galleries, gkey)) continue;
        out.galleries[gkey] = shared.galleries[gkey].map(function (item) {
          return item.id + ':' + (item.note || '');
        });
      }
      return out;
    },
    cardHTML: cardHTML,
    save: save,
    load: load,
    renderAll: renderAll,
    setView: setView,
    whenReady: function () { return ready || Promise.resolve(state); },
    storageOk: storage.ok
  };
})();
</script>
</body>
</html>
