name: 사진첩 APK 빌드

on:
  push:
    paths:
      - 'android-photo-album/**'
      - 'photo-album/**'
      - '.github/workflows/photo-album-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-photo-album
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 저장소 비밀값 ANDROID_KEYSTORE_BASE64 가 있으면 그 키로 서명(없으면 android/debug.keystore)
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: APK 빌드
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/our-photo-album.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: our-photo-album-apk
          path: our-photo-album.apk

      # main 에 올라가면 "최신 사진첩 APK" 릴리스로 올려 휴대폰에서 바로 받게 한다
      - name: 릴리스에 올리기
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: photo-album-apk-${{ github.run_number }}
          name: 우리 사진첩 APK 1.0.${{ github.run_number }}
          body: 휴대폰에서 our-photo-album.apk 를 내려받아 설치하세요.
          files: our-photo-album.apk
          make_latest: false  # "최신" 표시는 캘린더 APK 에 남겨 둔다
